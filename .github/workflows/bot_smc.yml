name: Reporte SMC Lite

on:
  workflow_dispatch: # Solo manual / disparado por el servicio de cronjob externo
    inputs:
      simbolo:
        description: "Activo a reportar (TODOS = los tres, uno tras otro)"
        required: false
        type: choice
        default: TODOS
        options:
          - TODOS
          - BOOM500
          - BOOM1000
          - V75

jobs:
  ejecutar-reporte-smc:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Seguro anti-zombies (cada activo se corta solo a los 180 s)
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
      SMC_CAPAS: ${{ vars.SMC_CAPAS }} # capas opcionales (variable de repositorio; vacía = ninguna)

    steps:
    - name: Clonar el código
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: .github/workflows/bot_smc.yml # no hay requirements.txt: la clave de la caché es este archivo

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install websockets pandas numpy "plotly<6" requests kaleido==0.2.1

    # Un paso por activo, uno tras otro. Con simbolo=TODOS (o sin entradas, disparo por API) corren los tres;
    # si uno falla los siguientes igual corren y el job queda en rojo.
    - name: Reporte SMC BOOM500
      if: ${{ !cancelled() && (inputs.simbolo == '' || inputs.simbolo == 'TODOS' || inputs.simbolo == 'BOOM500') }}
      timeout-minutes: 4
      run: python reporte_smc.py --simbolo BOOM500

    - name: Reporte SMC BOOM1000
      if: ${{ !cancelled() && (inputs.simbolo == '' || inputs.simbolo == 'TODOS' || inputs.simbolo == 'BOOM1000') }}
      timeout-minutes: 4
      run: python reporte_smc.py --simbolo BOOM1000

    - name: Reporte SMC V75
      if: ${{ !cancelled() && (inputs.simbolo == '' || inputs.simbolo == 'TODOS' || inputs.simbolo == 'V75') }}
      timeout-minutes: 4
      run: python reporte_smc.py --simbolo V75
