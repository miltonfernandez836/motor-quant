name: Motor Cuantitativo V75

on:
  workflow_dispatch: # Solo manual / disparado por el servicio de cronjob externo

jobs:
  ejecutar-reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Seguro anti-zombies

    steps:
    - name: Clonar el código
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install websockets pandas numpy "plotly<6" requests kaleido==0.2.1

    - name: Ejecutar motores y enviar a Telegram
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        PYTHONUNBUFFERED: "1"
      run: |
        fallos=0
        for script in reporte_v75.py reporte_boom500.py reporte_boom1000.py; do
          echo "=== $script ==="
          python "$script" || fallos=$((fallos+1))
        done
        exit $fallos
