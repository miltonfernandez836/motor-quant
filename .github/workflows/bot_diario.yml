name: Motor Cuantitativo V75

on:
  schedule:
    # Se ejecuta todos los días a las 11:00 UTC (07:00 AM hora local)
    - cron: '0 11 * * *'
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón

jobs:
  ejecutar-reporte:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código
      uses: actions/checkout@v3

    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install python-deriv-api pandas numpy plotly requests kaleido

    - name: Ejecutar motor y enviar a Telegram
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python reporte_diario.py
